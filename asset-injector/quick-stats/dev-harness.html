<!doctype html>
<!-- Local test page only. NOT pasted into Drupal. Mimics how Drupal loads the Quick Stats snippet. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Stats local harness</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="quick-stats.css">
</head>
<body>
  <div id="harness-errors" style="color:#b00;font:12px monospace"></div>
  <main id="harness-root"></main>

  <script>
    window.addEventListener('error', function (e) {
      document.getElementById('harness-errors').textContent += 'JS ERROR: ' + e.message + ' | ';
    });
    window.drupalSettings = {};
    // Test switches: ?fail=gis | ?fail=census  (requests fail), ?empty=gis (empty results)
    (function () {
      var q = new URLSearchParams(location.search), realFetch = window.fetch;
      window.fetch = function (url) {
        var u = String(url);
        var host = u.indexOf('gis.dola.colorado.gov') > -1 ? 'gis' : (u.indexOf('api.census.gov') > -1 ? 'census' : '');
        if (host && q.get('fail') === host && u.indexOf('componentYRS') === -1) return Promise.reject(new TypeError('Simulated failure'));
        if (host && q.get('empty') === host && u.indexOf('componentYRS') === -1) return Promise.resolve(new Response('[]', { status: 200 }));
        return realFetch.apply(this, arguments);
      };
    })();
    window.Drupal = { behaviors: {}, attachBehaviors: function (ctx) {
      for (var n in Drupal.behaviors) Drupal.behaviors[n].attach(ctx || document, drupalSettings);
    } };
  </script>
  <script src="../global-asset-injector-css-js/Global_SDO_Utilities_v2_combined.js"></script>
  <script src="quick-stats.js"></script>
  <script>
    fetch('quick-stats.html').then(function (r) { return r.text(); }).then(function (html) {
      document.getElementById('harness-root').innerHTML = html;
      Drupal.attachBehaviors(document);
    });
  </script>
</body>
</html>
