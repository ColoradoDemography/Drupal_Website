<script>
    const countyNames = {
        "1": "Adams County", "3": "Alamosa County", "5": "Arapahoe County",
        "7": "Archuleta County", "9": "Baca County", "11": "Bent County", "13": "Boulder County",
        "14": "Broomfield City and County", "15": "Chaffee County", "17": "Cheyenne County",
        "19": "Clear Creek County", "21": "Conejos County", "23": "Costilla County", "25": "Crowley County",
        "27": "Custer County", "29": "Delta County", "31": "Denver City and County", "33": "Dolores County",
        "35": "Douglas County", "37": "Eagle County", "39": "Elbert County", "41": "El Paso County",
        "43": "Fremont County", "45": "Garfield County", "47": "Gilpin County", "49": "Grand County",
        "51": "Gunnison County", "53": "Hinsdale County", "55": "Huerfano County", "57": "Jackson County",
        "59": "Jefferson County", "61": "Kiowa County", "63": "Kit Carson County", "65": "Lake County",
        "67": "La Plata County", "69": "Larimer County", "71": "Las Animas County", "73": "Lincoln County",
        "75": "Logan County", "77": "Mesa County", "79": "Mineral County", "81": "Moffat County",
        "83": "Montezuma County", "85": "Montrose County", "87": "Morgan County", "89": "Otero County",
        "91": "Ouray County", "93": "Park County", "95": "Phillips County", "97": "Pitkin County",
        "99": "Prowers County", "101": "Pueblo County", "103": "Rio Blanco County", "105": "Rio Grande County",
        "107": "Routt County", "109": "Saguache County", "111": "San Juan County", "113": "San Miguel County",
        "115": "Sedgwick County", "117": "Summit County", "119": "Teller County", "121": "Washington County",
        "123": "Weld County", "125": "Yuma County"
    };

    let dataTableInstance = null;

    $(document).ready(function() {
        // Initialize dynamic years select options from 2010 to 2060
        const yearsSelect = $('#years');
        for (let year = 2010; year <= 2060; year++) {
            const selectedAttr = (year === 2024) ? 'selected' : ''; // Default selection to current context
            yearsSelect.append(`<option value="${year}" ${selectedAttr}>${year}</option>`);
        }

        // Initialize Select2 dropdown elements
        $('#counties').select2({
            theme: 'bootstrap-5',
            placeholder: 'Select counties',
            closeOnSelect: false
        });

        $('#years').select2({
            theme: 'bootstrap-5',
            placeholder: 'Select years',
            closeOnSelect: false
        });

        // Pre-select Adams County and Statewide as examples
        $('#counties').val(['0', '1']).trigger('change');

        // Form selection helpers
        $('#selectAllCounties').click(() => {
            const allKeys = Object.keys(countyNames);
            $('#counties').val(allKeys).trigger('change');
        });

        $('#clearAllCounties').click(() => {
            $('#counties').val(null).trigger('change');
        });

        $('#selectAllYears').click(() => {
            const allYears = [];
            for (let y = 2010; y <= 2060; y++) allYears.push(y.toString());
            $('#years').val(allYears).trigger('change');
        });

        $('#clearAllYears').click(() => {
            $('#years').val(null).trigger('change');
        });

        $('#selectAllAges').click(() => {
            const allChecked = $('.age-checkbox').filter(':checked').length === $('.age-checkbox').length;
            $('.age-checkbox').prop('checked', !allChecked);
        });

        // Form Submit Action
        $('#queryForm').on('submit', function(e) {
            e.preventDefault();
            fetchLaborForceData();
        });

        // Reset Action
        $('#btnReset').click(() => {
            //$('#queryForm').reset();
            $('#counties').val(['1']).trigger('change');
            $('#years').val(['2024']).trigger('change');
            
            if (dataTableInstance) {
                dataTableInstance.destroy();
                $('#lfpTable').empty();
                dataTableInstance = null;
            }
            $('#tableContainer').addClass('d-none');
            $('#exportButtonsContainer').empty();
            $('#tableAlert').removeClass('d-none').html(
                `<i class="fa-solid fa-info-circle me-2"></i>Selections reset. Configure your filters and click <strong>Generate Table</strong>.`
            );
        });
    });

    // Main API retrieval function
    function fetchLaborForceData() {
        const counties = $('#counties').val();
        const years = $('#years').val();
        
        // Collect checked age values
        const ages = [];
        $('.age-checkbox:checked').each(function() {
            ages.push($(this).val());
        });

        // Validations
        if (!counties || counties.length === 0) {
            showAlert('danger', 'Please select at least one County.');
            return;
        }
        if (!years || years.length === 0) {
            showAlert('danger', 'Please select at least one Year.');
            return;
        }
        if (ages.length === 0) {
            showAlert('danger', 'Please select at least one Age Group.');
            return;
        }

        // Calculate grouping opt parameter
        const yrChecked = $('#groupByYear').is(':checked');
        const coChecked = $('#groupByCounty').is(':checked');
        const ageChecked = $('#groupByAge').is(':checked');

        let groupParam = null;
        if (yrChecked && !coChecked && !ageChecked) groupParam = 'opt1';
        else if (!yrChecked && coChecked && !ageChecked) groupParam = 'opt2';
        else if (!yrChecked && !coChecked && ageChecked) groupParam = 'opt3';
        else if (yrChecked && coChecked && !ageChecked) groupParam = 'opt4';
        else if (yrChecked && !coChecked && ageChecked) groupParam = 'opt5';
        else if (!yrChecked && coChecked && ageChecked) groupParam = 'opt6';

        // Get gender radio value
        const genderVal = $('input[name="gender"]:checked').val();

        // Build Query URL
        // In local setups, update '/labor-force' to match your development domain (e.g. 'http://localhost:3000/labor-force')
        let apiUrl = `https://gis.dola.colorado.gov/lookups/labor-force?county=${counties.join(',')}&year=${years.join(',')}&age=${ages.join(',')}`;
        
        if (groupParam) {
            apiUrl += `&group=${groupParam}`;
        }
        if (genderVal !== 'sum') {
            apiUrl += `&gender=${genderVal}`;
        }

        // Show fetching spinner in alert status
        $('#tableContainer').addClass('d-none');
        $('#tableAlert').removeClass('d-none alert-danger alert-info').addClass('alert-warning').html(
            `<div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div> Querying SDO Database...`
        );
        $('#exportButtonsContainer').empty();
console.log(apiUrl);
var data;
        /* fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error('API server returned an error response.');
                return response.json();
            })
            .then(data => {
                if (!data || data.length === 0) {
                    showAlert('warning', 'No records found matching those exact parameter selections.');
                    return;
                }
                
                $('#tableAlert').addClass('d-none');
                $('#tableContainer').removeClass('d-none');
                initializeDataTable(data);
            })
            .catch(error => {
                console.error(error);
                showAlert('danger', `<strong>Fetch Failed:</strong> Could not connect to the labor force service. Ensure the Node backend route is active.`);
            }); */

       $.getJSON(apiUrl, function(json){
        data = json;
        if (!data || data.length === 0) {
            showAlert('warning', 'No records found matching those exact parameter selections.');
            return;
        }
        
        $('#tableAlert').addClass('d-none');
        $('#tableContainer').removeClass('d-none');
        initializeDataTable(data);
       })     
    }

    // Dynamic DataTable setup
    function initializeDataTable(dataSet) {
        // 1. Destroy any existing instance to free memory
        if (dataTableInstance) {
            dataTableInstance.destroy();
            dataTableInstance = null;
        }

        // 2. Clear out the previous buttons and recreate the table element
        $('#exportButtonsContainer').empty();
        $('#tableContainer').html('<table id="lfpTable" class="table table-striped table-bordered w-100"></table>');

        // 3. Extract columns dynamically from the keys in the first row
        const sampleRow = dataSet[0]; 
        const recordKeys = Object.keys(sampleRow);
        
        const columnDefinitions = recordKeys.map(key => {
            let columnTitle = key;
            let renderer = null;

            if (key === 'area_code') {
                columnTitle = 'County';
                renderer = (val) => countyNames[val] || `FIPS ${val}`;
            } else if (key === 'population_year') {
                columnTitle = 'Year';
            } else if (key === 'age_group') {
                columnTitle = 'Age Group';
            } else if (key === 'gender') {
                columnTitle = 'Sex';
            } else if (key === 'laborforce') {
                columnTitle = 'Labor Force';
                renderer = (val) => val ? Number(val).toLocaleString() : '0';
            } else if (key === 'cni_pop_16pl') {
                columnTitle = 'Civilian Pop. (16+)';
                renderer = (val) => val ? Number(val).toLocaleString() : '0';
            } else if (key === 'participationrate') {
                columnTitle = 'Participation Rate';
                renderer = (val) => val ? (Number(val) * 100).toFixed(1) + '%' : '-';
            }

            return {
                data: key,
                title: columnTitle,
                render: renderer,
                className: ['laborforce', 'cni_pop_16pl', 'participationrate'].includes(key) ? 'text-end' : 'text-start'
            };
        });

        // 4. Initialize DataTables with native button configurations
        dataTableInstance = $('#lfpTable').DataTable({
            data: dataSet,
            columns: columnDefinitions,
            pageLength: 25,
            lengthMenu: [10, 25, 50, 100], // FIXED: Resolved previous syntax comma error
            responsive: true,
            // 'B' initializes the buttons, 'lfrtip' lays out the length, filter, processing, table, info, and paging elements
            dom: 'Blfrtip', 
            order: [], // Keeps SQL database sorting order
            buttons: [
                {
                    extend: 'copy',
                    className: 'btn btn-sm bg-white text-black border',
                    text: '<i class="fa-solid fa-copy me-1 text-primary"></i> Copy'
                },
                {
                    extend: 'csv',
                    className: 'btn btn-sm bg-white text-black border',
                    text: '<i class="fa-solid fa-file-csv me-1 text-primary"></i> CSV'
                },
                {
                    extend: 'excel',
                    className: 'btn btn-sm bg-white text-black border',
                    text: '<i class="fa-solid fa-file-excel me-1 text-primary"></i> Excel'
                },
                {
                    extend: 'pdf',
                    className: 'btn btn-sm bg-white text-black border',
                    text: '<i class="fa-solid fa-file-pdf me-1 text-primary"></i> PDF'
                },
                {
                    extend: 'print',
                    className: 'btn btn-sm bg-white text-black border',
                    text: '<i class="fa-solid fa-print me-1 text-primary"></i> Print'
                }
            ],
            initComplete: function() {
                // Move the generated button container into our target div
                dataTableInstance.buttons().container().appendTo('#exportButtonsContainer');
                
                // Add minor UI styling to spacing
                $('#exportButtonsContainer .btn-group').addClass('shadow-sm');
            }
        });
    }

    function showAlert(type, message) {
        $('#tableContainer').addClass('d-none');
        $('#tableAlert').removeClass('d-none alert-info alert-warning alert-danger').addClass(`alert-${type}`).html(
            `<i class="fa-solid fa-triangle-exclamation me-2"></i>${message}`
        );
    }
</script>

</body>
